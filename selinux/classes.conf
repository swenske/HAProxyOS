#
# Generated. DO NOT EDIT BY HAND.
#
# The object classes, common permission sets, access vectors, initial SID
# names, and policy capabilities this exact pinned kernel (see
# ../versions.mk) actually compiles in - i.e. the "flask" header every
# SELinux policy needs, and exactly what scripts/selinux/mdp/mdp (a small
# tool shipped in the kernel source tree itself, purpose-built for
# bootstrapping a minimal policy for a system with no existing distro
# policy to inherit from - which is exactly this project's situation) is
# for. Regenerate via, from a checkout of the pinned kernel source with
# ../kernel/configs/haproxyos_defconfig already merged in as .config:
#
#   make ARCH=x86_64 olddefconfig && make ARCH=x86_64 prepare \
#     && make ARCH=x86_64 scripts
#   cd scripts/selinux/mdp && ./mdp policy.conf file_contexts
#
# (no `-m` flag - that enables MLS, which this project deliberately
# doesn't use: a single sensitivity level with real type-enforcement
# rules covers everything this policy needs, and skips ~2000 lines of
# per-class `mlsconstrain` boilerplate that plain TE has no use for).
# The output's `policy.conf` splits cleanly in two: everything up to
# (and including) the last `policycap` line - this file - is generated
# straight from the kernel's own compiled-in class list and needs no
# project-specific judgement at all; everything after it (starting at
# `type base_t;`) is mdp's own example single-domain "allow everything"
# skeleton, which ../policy.conf replaces entirely with this project's
# real domains/types/transitions/rules - see that file for the union.
# `checkpolicy` (below) then compiles classes.conf + policy.conf
# together as one policy source, in that order.
#
