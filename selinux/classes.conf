# mdp itself emits every policycap name the KERNEL recognizes, but
# `checkpolicy` (the userspace compiler, ../Dockerfile) only accepts
# names its own linked libsepol build recognizes - a real version-skew
# gap found by a real compile failing ("invalid policy capability name
# netif_wildcard"), not assumed: Debian trixie's libsepol
# (checkpolicy 3.8.1-1) only understands network_peer_controls,
# open_perms, extended_socket_class, always_check_network,
# cgroup_seclabel, nnp_nosuid_transition, userspace_initial_context,
# and netlink_xperm (confirmed by grepping the actual strings compiled
# into its libsepol.so.2) - genfs_seclabel_symlinks, ioctl_skip_cloexec,
# netif_wildcard, genfs_seclabel_wildcard, and functionfs_seclabel are
# newer additions this kernel (6.18.53) knows about that this toolchain
# doesn't yet. All five are optional kernel-side conveniences (finer-
# grained genfscon/wildcard/ioctl behaviors), never required for basic
# enforcement, so they're just left out here rather than chased with a
# newer checkpolicy - re-check this list against ../Dockerfile's
# checkpolicy version if the kernel or that image's package set ever
# moves.
policycap network_peer_controls;
policycap open_perms;
policycap extended_socket_class;
policycap always_check_network;
policycap cgroup_seclabel;
policycap nnp_nosuid_transition;
policycap userspace_initial_context;
policycap netlink_xperm;
