name: Claude PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: >
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login != 'claude[bot]' &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-haiku-4-5-20251001
            --allowedTools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            Review pull request #${{ github.event.issue.number }} on Janus,
            an ultra-light, immutable, API-driven Linux distribution (inspired
            by Talos Linux) built around HAProxy, with a Go/gRPC control-plane
            daemon (janusd) and CLI (janusctl).

            Run `gh pr diff ${{ github.event.issue.number }}` to see exactly
            what changed. Only read additional files when you need
            surrounding context to judge whether a change is safe.

            Focus exclusively on:
            - Correctness bugs in Go code: nil-pointer/bounds issues, incorrect
              error handling, wrong gRPC status codes, races on shared state.
            - Anything that would break the project's core invariants: no
              endpoint may bypass mTLS once it's wired up (internal/pki), no
              RPC may allow arbitrary command execution (the whole point of
              the "no shell" design - see CLAUDE.md/docs/architecture.md),
              build-system tooling (Dockerfiles, Makefile) must never leak
              into the immutable target rootfs.
            - .proto changes: incompatible field renumbering/removal, a new
              RPC that should stream but doesn't (or vice versa) for
              long-running/dangerous operations (Upgrade, Reset,
              ApplyConfiguration).
            - Idiomatic Go error handling: wrapped errors with context, no
              swallowed errors.

            Skip anything already covered by golangci-lint (govet,
            staticcheck, errcheck, ineffassign, unused, misspell).

            Report at most the 5 most significant findings, tagged [Critical]
            / [Major] / [Minor]. Use inline comments only for line-specific
            findings; reserve broader concerns for the summary. If you find
            nothing significant, say so explicitly rather than inventing
            minor nitpicks.

            Be specific and reference exact file/line locations.

            Post your summary using exactly:
            gh pr comment ${{ github.event.issue.number }} --body "<your summary>"
        env:
          GH_TOKEN: ${{ github.token }}
