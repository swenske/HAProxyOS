# Full HAProxyOS image build: kernel, pkgs/*, rootfs assembly, and the
# per-target disk images (image/disk, image/iso, image/kvm-proxmox,
# image/vmware). Runs on the self-hosted runner - this is the heavy,
# long-running, Docker-and-toolchain-dependent job, kept strictly separate
# from ci.yml (GitHub-hosted, safe for forks).
#
# workflow_dispatch only, on purpose - never triggered by push/pull_request.
# Phase 1 (kernel + shell-less init boots under QEMU) and Phase 2 (static
# HAProxy, supervised by haproxyosd, reachable over the network *inside*
# the QEMU-booted kernel via virtio-net + DHCP) are real as of the steps
# below - verified both locally and by running this exact workflow.
# rootfs/assemble.sh and image/* (Phase 3) are still stubs - filled in
# phase by phase (see docs/architecture.md's roadmap) rather than added
# all at once.
name: Image Build

on:
  workflow_dispatch: {}

concurrency:
  group: image-build
  cancel-in-progress: false

jobs:
  build:
    # This project's own self-hosted runner (persistent Docker + build
    # cache), matching swenske/gotochanger's release.yml convention. Never
    # used for pull_request-triggered jobs - see ci.yml.
    runs-on: [self-hosted, docker, haproxyos]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install QEMU + rootfs build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 squashfs-tools cryptsetup-bin e2fsprogs gdisk \
            ovmf systemd-ukify mtools dosfstools sbsigntool python3-virt-firmware

      # Phase 1: builds bzImage (kernel/Dockerfile's fetch -> config ->
      # build -> export stages) + the init-only initramfs (rootfs/init,
      # hack/build-initramfs.sh - no pkgs/musl-toolchain or pkgs/busybox
      # needed, a CGO_ENABLED=0 Go binary has no libc to link against),
      # boots them under QEMU, checks for rootfs/init's success marker on
      # the console (hack/qemu-run.sh). Fast, no HAProxy involved - a
      # regression check on the boot chain itself.
      - name: Kernel boot test (Phase 1)
        run: make qemu-boot-test

      # Phase 2: builds the static musl+OpenSSL haproxy binary (pkgs/
      # haproxy/Dockerfile) and haproxyosd, packages init + haproxyosd +
      # haproxy + the bootstrap config into a second initramfs (rootfs/
      # init detects haproxyosd's presence and supervises it instead of
      # powering off), boots that under QEMU with virtio-net + DHCP, and
      # polls a forwarded host port until HAProxy - running *inside* the
      # VM - answers over real TCP/IP (hack/qemu-network-test.sh).
      - name: HAProxy network boot test (Phase 2)
        run: make qemu-network-test

      # Host-level check of the gRPC API surface itself (ApplyConfig/
      # ShowInfo/...) - faster than going through QEMU for this, and
      # exercises paths (ApplyConfig's seamless reload) the network boot
      # test above doesn't touch.
      - name: Build control-plane binaries
        run: make build

      - name: HAProxy gRPC API integration test (mTLS)
        run: |
          set -euo pipefail
          # haproxyosd's own default paths (-haproxy-config/-pid/-stats-socket/
          # -pki-dir) ARE the real target layout - use them as-is rather than
          # workspace-relative paths, since haproxy.cfg's "stats socket" line
          # (rootfs/base/etc/haproxy/haproxy.cfg) hardcodes
          # /run/haproxyos/haproxy-admin.sock and must match whatever
          # haproxyosd is told to look for.
          sudo mkdir -p /run/haproxyos /etc/haproxy /etc/haproxyos
          sudo cp rootfs/base/etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg
          # chroot /var/empty is in that config now - the chroot() syscall
          # needs real root (CAP_SYS_CHROOT), so haproxyosd (and therefore
          # haproxy, its child) runs under sudo here, matching how PID 1
          # (rootfs/init, itself root) actually starts it on the real
          # target OS. haproxyosctl needs sudo too, purely to read the
          # root-owned PKI files haproxyosd bootstraps.
          sudo mkdir -p /var/empty && sudo chmod 000 /var/empty

          sudo ./bin/haproxyosd -addr :19505 -haproxy-binary "$PWD/build/haproxy" \
            & echo $! > /tmp/haproxyosd.pid
          trap 'sudo kill "$(cat /tmp/haproxyosd.pid)" 2>/dev/null || true; sudo pkill -f "$PWD/build/haproxy" 2>/dev/null || true' EXIT

          sleep 2
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
          if [ "$code" != "200" ]; then
            echo "expected HTTP 200 from the bootstrap health frontend, got $code" >&2
            exit 1
          fi

          # First boot generated a CA + admin client certificate at
          # /etc/haproxyos/pki (see internal/pki) - haproxyosctl's own
          # defaults already point there, matching a real node where ctl
          # and daemon share a filesystem.
          sudo ./bin/haproxyosctl -endpoint 127.0.0.1:19505 haproxy show-info

          # Exercise GenerateClientConfiguration for real: issue a second
          # client certificate over the mTLS-authenticated connection and
          # confirm it authenticates on its own.
          sudo ./bin/haproxyosctl -endpoint 127.0.0.1:19505 pki generate-client-config /tmp/ci-client
          sudo ./bin/haproxyosctl -endpoint 127.0.0.1:19505 \
            -ca /tmp/ci-client/ca.crt -cert /tmp/ci-client/client.crt -key /tmp/ci-client/client.key \
            version

          # Role enforcement (internal/api/authz.go): an os:reader cert
          # must be able to call a read-only RPC and must be rejected
          # (PermissionDenied) on a mutating one - including trying to
          # self-escalate via GenerateClientConfiguration.
          sudo ./bin/haproxyosctl -endpoint 127.0.0.1:19505 pki generate-client-config -role os:reader /tmp/ci-reader
          reader_flags=(-ca /tmp/ci-reader/ca.crt -cert /tmp/ci-reader/client.crt -key /tmp/ci-reader/client.key)
          sudo ./bin/haproxyosctl -endpoint 127.0.0.1:19505 "${reader_flags[@]}" haproxy show-info

          if sudo ./bin/haproxyosctl -endpoint 127.0.0.1:19505 "${reader_flags[@]}" haproxy apply-config rootfs/base/etc/haproxy/haproxy.cfg 2>/tmp/reader-denied.log; then
            echo "expected os:reader to be denied ApplyConfig, it succeeded" >&2
            exit 1
          fi
          grep -q PermissionDenied /tmp/reader-denied.log || { echo "expected a PermissionDenied error, got:" >&2; cat /tmp/reader-denied.log >&2; exit 1; }

      # internal/haproxy/runtime_maps.go and runtime_certs.go: exercised
      # against real file-backed map/ACL entries and a real uploaded
      # certificate, not just unit-tested against captured fixtures (see
      # internal/haproxy/runtime_maps_test.go / runtime_certs_test.go for
      # those). A previous haproxyosd instance's config didn't declare any
      # maps/ACLs (rootfs/base/etc/haproxy/haproxy.cfg is deliberately
      # minimal) - MapList/ACLUpdate only ever see *file-backed*
      # maps/ACLs, so this step applies its own config with one of each,
      # plus an HTTPS frontend backed by a crt-list (seeded with one
      # starter cert - HAProxy refuses to start a bind with an empty
      # crt-list) to exercise CertificateUpload's -crt-list/-sni binding.
      - name: HAProxy runtime map/ACL/certificate test
        run: |
          set -euo pipefail
          mkdir -p /tmp/rt-maps /tmp/rt-acls /tmp/rt-certs
          echo "www.example.com backend1" > /tmp/rt-maps/hosts.map
          echo "1.2.3.4" > /tmp/rt-acls/blocked.acl

          openssl req -x509 -newkey ed25519 -keyout /tmp/rt-certs/default.key -out /tmp/rt-certs/default.crt -days 1 -nodes -subj "/CN=default.local" 2>/dev/null
          cat /tmp/rt-certs/default.crt /tmp/rt-certs/default.key > /tmp/rt-certs/default.pem
          echo "/tmp/rt-certs/default.pem" > /tmp/rt-certs/crt-list.txt

          cat > /tmp/rt-haproxy.cfg <<'EOF'
          global
              stats socket /run/haproxyos/haproxy-admin.sock mode 660 level admin
          defaults
              mode http
              timeout connect 5s
              timeout client 30s
              timeout server 30s
          frontend haproxyos-health
              bind *:8080
              acl blocked src -f /tmp/rt-acls/blocked.acl
              http-request deny if blocked
              http-request set-header X-Mapped %[req.hdr(host),map(/tmp/rt-maps/hosts.map,default)]
              http-request return status 200 content-type text/plain string "up\n"
          frontend haproxyos-tls
              bind *:8443 ssl crt-list /tmp/rt-certs/crt-list.txt
              http-request return status 200 content-type text/plain string "tls-up\n"
          EOF

          sudo mkdir -p /run/haproxyos /etc/haproxy /etc/haproxyos
          sudo chown -R "$(id -u):$(id -g)" /run/haproxyos /etc/haproxy /etc/haproxyos
          sudo mkdir -p /var/empty && sudo chmod 000 /var/empty

          # haproxyosd starts haproxy with this exact config at boot
          # (-haproxy-config) - no need to re-apply it over the API
          # afterward. Doing so anyway raced the seamless reload against
          # the runtime-API calls below and was caught here in a local
          # dry run before it reached CI: some calls landed on the old,
          # draining process instead of the new one, producing
          # hard-to-explain failures ("No ongoing transaction!" on a
          # commit whose "set" had just "succeeded") that had nothing to
          # do with the map/ACL/cert code itself.
          ./bin/haproxyosd -addr :19506 -haproxy-binary "$PWD/build/haproxy" \
            -pki-dir /etc/haproxyos/pki-rt -haproxy-config /tmp/rt-haproxy.cfg \
            & echo $! > /tmp/haproxyosd-rt.pid
          trap 'kill "$(cat /tmp/haproxyosd-rt.pid)" 2>/dev/null || true; pkill -f "$PWD/build/haproxy" 2>/dev/null || true' EXIT
          sleep 2
          ctl() { ./bin/haproxyosctl -endpoint 127.0.0.1:19506 -ca /etc/haproxyos/pki-rt/ca.crt \
            -cert /etc/haproxyos/pki-rt/admin.crt -key /etc/haproxyos/pki-rt/admin.key "$@"; }

          [ "$(ctl haproxy map-list)" = "/tmp/rt-maps/hosts.map" ]
          ctl haproxy map-set /tmp/rt-maps/hosts.map www.new.com backendX
          ctl haproxy map-get /tmp/rt-maps/hosts.map | grep -q "^www.new.com backendX$"
          ctl haproxy map-delete /tmp/rt-maps/hosts.map www.new.com
          ! ctl haproxy map-get /tmp/rt-maps/hosts.map | grep -q www.new.com

          ctl haproxy acl-add /tmp/rt-acls/blocked.acl 5.6.7.8
          ctl haproxy acl-delete /tmp/rt-acls/blocked.acl 5.6.7.8

          openssl req -x509 -newkey ed25519 -keyout /tmp/rt-cert.key -out /tmp/rt-cert.crt -days 1 -nodes -subj "/CN=rt.example.com" 2>/dev/null
          cat /tmp/rt-cert.crt /tmp/rt-cert.key > /tmp/rt-cert-bundle.pem
          ctl haproxy cert-upload /tmp/rt-uploaded.pem /tmp/rt-cert-bundle.pem
          ctl haproxy cert-list | grep -q "^/tmp/rt-uploaded.pem.*status=Unused"
          ctl haproxy cert-delete /tmp/rt-uploaded.pem

          # Now the actual crt-list binding: upload+bind with an SNI
          # filter, confirm HAProxy serves it only for that SNI (a plain
          # connection with no SNI must still get the seeded default
          # cert), then unbind+delete.
          openssl req -x509 -newkey ed25519 -keyout /tmp/rt-certs/uploaded.key -out /tmp/rt-certs/uploaded.crt -days 1 -nodes -subj "/CN=uploaded.local" 2>/dev/null
          cat /tmp/rt-certs/uploaded.crt /tmp/rt-certs/uploaded.key > /tmp/rt-certs/uploaded.pem
          ctl haproxy cert-upload -crt-list /tmp/rt-certs/crt-list.txt -sni uploaded.local \
            /tmp/rt-certs/uploaded.pem /tmp/rt-certs/uploaded.pem
          ctl haproxy cert-list | grep -q "^/tmp/rt-certs/uploaded.pem.*status=Used"

          got="$(openssl s_client -connect 127.0.0.1:8443 -servername uploaded.local </dev/null 2>/dev/null | grep subject=)"
          [ "$got" = "subject=CN=uploaded.local" ] || { echo "expected the SNI-bound cert, got: $got" >&2; exit 1; }
          got="$(openssl s_client -connect 127.0.0.1:8443 </dev/null 2>/dev/null | grep subject=)"
          [ "$got" = "subject=CN=default.local" ] || { echo "expected the default cert with no SNI, got: $got" >&2; exit 1; }

          ctl haproxy cert-delete -crt-list /tmp/rt-certs/crt-list.txt /tmp/rt-certs/uploaded.pem
          ctl haproxy cert-list | grep -q "^/tmp/rt-certs/uploaded.pem" && { echo "expected the cert to be gone after delete" >&2; exit 1; } || true

      # Phase 2 is now fully done (see docs/architecture.md): HAProxy
      # integration, mTLS + role enforcement, Map*/ACLUpdate/Certificate*
      # including crt-list binding, restart-on-crash, chroot/uid.

      # Phase 3, first slice: builds a squashfs image of the real rootfs
      # and its dm-verity hash tree (rootfs/assemble.sh), then proves
      # verification actually works both ways - accepts the real image
      # against its own root hash, and rejects a single-byte-tampered
      # copy of it.
      - name: Rootfs squashfs + dm-verity build test (Phase 3)
        run: |
          set -euo pipefail
          # veritysetup (cryptsetup-bin) installs to /usr/sbin, which this
          # runner's non-interactive shell doesn't have on PATH by default
          # (confirmed on haproxyos-runner01: run 35817622995 failed here
          # with "command not found" right after rootfs/assemble.sh's own
          # veritysetup call succeeded, because that script now extends its
          # own PATH but this step's direct calls below did not).
          export PATH="$PATH:/usr/sbin:/sbin"
          make rootfs-build
          roothash="$(cat build/rootfs/rootfs.roothash)"
          veritysetup verify build/rootfs/rootfs.squashfs build/rootfs/rootfs.verity "$roothash"

          cp build/rootfs/rootfs.squashfs /tmp/tampered.squashfs
          printf '\xFF' | dd of=/tmp/tampered.squashfs bs=1 seek=500000 count=1 conv=notrunc status=none
          if veritysetup verify /tmp/tampered.squashfs build/rootfs/rootfs.verity "$roothash" 2>/tmp/tamper-check.log; then
            echo "expected a tampered image to fail verification, it passed" >&2
            exit 1
          fi
          grep -q "Verification failed" /tmp/tamper-check.log || { echo "expected a verification-failed message, got:" >&2; cat /tmp/tamper-check.log >&2; exit 1; }

      # Phase 3, second slice: boots the kernel directly from that
      # squashfs+dm-verity image via the "dm-mod.create=" cmdline
      # parameter (CONFIG_DM_INIT) - no initramfs, no userspace verity
      # setup. Also proves the *kernel itself* (not just `veritysetup
      # verify` on the build host, above) refuses to mount a tampered
      # copy of the image. See hack/qemu-verity-boot-test.sh.
      - name: Rootfs dm-verity kernel boot test (Phase 3 cont'd)
        run: make qemu-verity-boot-test

      # Phase 3 cont'd: proves rootfs/state-image.sh's persistent STATE
      # partition survives a reboot, not just that it mounts - three
      # boots against the SAME state.img: haproxyosd's "first boot" log
      # line appears once, not twice (PKI persists), and a config
      # written directly onto the persisted haproxy/ subdirectory
      # between boots (standing in for a real ApplyConfig RPC) is what
      # HAProxy actually starts from afterward, not the squashfs's
      # read-only bootstrap default. See hack/qemu-state-persist-test.sh
      # and rootfs/init/main.go's mountState/mountEphemeral for what's
      # ephemeral (/run, /tmp) vs persistent (/etc/haproxyos/pki and
      # /etc/haproxy, bind-mounted from the STATE partition).
      - name: Persistent STATE partition survives a reboot (Phase 3 cont'd)
        run: make qemu-state-persist-test

      # Phase 3 cont'd: assembles a single, real GPT-partitioned disk
      # image (image/disk/assemble.sh - BOOT-A-DATA/HASH,
      # BOOT-B-DATA/HASH, STATE, all on one disk) and proves both A/B
      # slots are independently bootable - the real, single-disk shape
      # a deployed node would actually have, not just the separate-
      # virtio-blk-drives test harness the steps above use (which keeps
      # working, and still covers what it always covered). Both slots
      # hold the same content for now - no LifecycleService.Upgrade yet
      # to install something different into the inactive one. See
      # hack/qemu-ab-boot-test.sh.
      # A third boot, back on slot A, proves rootfs/init/main.go's
      # resolveStateDevice (cmdline.go) actually finds STATE (partition
      # 6 - image/disk/assemble.sh now has an ESP as partition 1 too,
      # ahead of both A/B slots) on this real single-disk layout by
      # parsing its own /proc/cmdline - haproxyosd's "first boot" log
      # line must not reappear, since boot 1 already bootstrapped a CA
      # there. See hack/qemu-ab-boot-test.sh's own comment for why the
      # disk isn't attached read-only for this test (dm-verity's own
      # "ro" flag already protects the root mapping regardless).
      - name: A/B disk image - both slots independently boot (Phase 3 cont'd)
        run: make qemu-ab-boot-test

      # Phase 3 cont'd: assembles a real Unified Kernel Image (`ukify` -
      # kernel + exact cmdline, one PE/COFF executable) and a FAT32 ESP
      # with it at \EFI\BOOT\BOOTX64.EFI, then boots it under *real*
      # OVMF UEFI firmware - no QEMU -kernel/-append shortcut at all.
      # Needed CONFIG_ACPI in the kernel for the first time (CONFIG_EFI
      # depends on it) plus CONFIG_EFI/CONFIG_EFI_STUB - the vanilla
      # kernel's own EFI stub only reads its cmdline from EFI
      # LoadOptions (an interactive shell invocation), not a `.cmdline`
      # PE section, so `ukify`'s stub (systemd-stub) is what actually
      # reads the embedded cmdline and chain-loads into the kernel's own
      # EFI stub via the handover protocol - confirmed by reading the
      # kernel's own stub source, not assumed. Uses a standalone
      # ESP + two separate squashfs/verity drives, not
      # image/disk/assemble.sh's merged disk - see the next step for
      # that. See hack/qemu-uefi-boot-test.sh.
      - name: UKI boots under real UEFI firmware (Phase 3 cont'd)
        run: make qemu-uefi-boot-test

      # Phase 3 cont'd: the ESP now lives on image/disk/assemble.sh's
      # single GPT disk too (partition 1, ahead of both A/B slots) - the
      # real, complete, single-disk shape a deployed node would have.
      # Proves the whole thing end to end under real OVMF firmware (one
      # virtio-blk drive, no -kernel/-append), AND that
      # image/disk/activate-slot.sh's in-place ESP swap - rewriting only
      # the ESP to point at the other slot, leaving BOOT-A/BOOT-B/STATE
      # untouched - actually works: boot slot A (fresh CA onto STATE),
      # switch to slot B in place, boot again, confirm slot B is live
      # *and* STATE (the CA) survived the switch. This is the
      # build/install-time half of what the next step proves works at
      # runtime too. See hack/qemu-uefi-ab-boot-test.sh.
      - name: Single-disk UEFI A/B - slot switch survives with STATE intact (Phase 3 cont'd)
        run: make qemu-uefi-ab-boot-test

      # Phase 3 cont'd: LifecycleService.Rollback (internal/api/
      # lifecycle.go) is real - the gRPC front end for the same ESP
      # swap the step above drives directly, except this runs it on an
      # already-booted node with a real mTLS call, and the node - which
      # has no package manager, so it can never shell out to `ukify` the
      # way image/disk/activate-slot.sh does - just mounts the ESP
      # (CONFIG_VFAT_FS) and copies the other slot's pre-staged UKI
      # (\HAPROXYOS\UKI-A.EFI / UKI-B.EFI, staged there by
      # activate-slot.sh precisely so this doesn't need to build
      # anything at runtime) over \EFI\BOOT\BOOTX64.EFI, then reboots
      # for real. This test boots without -no-reboot, unlike every
      # other boot test here, specifically so the guest can actually
      # reboot itself inside the same QEMU process - and checks the
      # boot marker appears exactly twice, the cmdline on the second
      # boot references slot B's partitions, and PKI's "first boot" line
      # appears exactly once (STATE survived a real, API-driven reboot).
      # mTLS credentials for the test's own haproxyosctl call are
      # extracted straight from disk.img's STATE partition via debugfs
      # (not the console - haproxyosd only ever prints the admin cert/
      # key there once, on first boot, and never the CA cert at all, by
      # design - see cmd/haproxyosd/main.go). See
      # hack/qemu-lifecycle-rollback-test.sh.
      - name: LifecycleService.Rollback reboots into the other slot for real (Phase 3 cont'd)
        run: make qemu-lifecycle-rollback-test

      # Phase 3 cont'd: Secure Boot signing/enforcement is real, proven
      # both directions - a UKI signed with a throwaway test key
      # (image/secureboot/gen-test-key.sh, generated fresh every run,
      # never committed - a real project release key needs real key
      # management, out of scope here) boots under genuinely
      # Secure-Boot-enabled UEFI firmware with that key enrolled
      # (image/secureboot/enroll-vars.sh), and an unsigned UKI on the
      # exact same enrolled vars is refused by firmware itself ("Access
      # Denied"), never even reaching the kernel. `enroll-vars.sh`'s own
      # comment explains a real bug caught along the way: `virt-fw-vars
      # --enroll-cert` (the obvious "just enroll my cert" shortcut)
      # only populates PK/KEK, never db - the one list that actually
      # authorizes *boot images* - so a correctly signed UKI still got
      # "Access Denied" until switched to explicit --set-pk/--add-kek/
      # --add-db (same cert, all three). This test also needs the
      # secboot-capable OVMF binary (OVMF_CODE_4M.secboot.fd) plus
      # `-machine q35,smm=on` specifically - the plain i440fx machine
      # type every other boot test here uses produces zero console
      # output at all with that firmware binary (found by an identical
      # command, only the machine type changed, going from a total
      # hang to a normal boot). See hack/qemu-secureboot-test.sh.
      - name: Secure Boot enforcement, both directions (Phase 3 cont'd)
        run: make qemu-secureboot-test

      # Phase 3 cont'd: LifecycleService.Upgrade (internal/api/
      # lifecycle.go) is real - installs a *genuinely new* rootfs onto
      # the inactive slot from a local "release bundle" directory
      # (image/release/assemble.sh: rootfs.squashfs/rootfs.verity/
      # uki-a.efi/uki-b.efi - the UKI has to be pre-built, same reason
      # Rollback's ESP swap only ever copies a pre-staged UKI, never
      # builds one: no package manager on the node, so `ukify` can
      # never run there). The test builds a second rootfs with
      # different content (different squashfs, different root hash),
      # injects its release bundle into disk.img's STATE partition via
      # debugfs *before* the first boot (haproxyosctl and haproxyosd
      # don't share a filesystem across this QEMU host/guest boundary,
      # unlike CLAUDE.md's normal "share a filesystem" case - and
      # writing to STATE from the host while the guest also has it
      # mounted read-write would corrupt it), then drives a real gRPC
      # Upgrade call that writes the new squashfs/verity to slot B,
      # switches the ESP, and reboots. A real bug was found writing
      # this test - not in Upgrade itself, but in the test's own first
      # assumption that a different bootstrap HAProxy config (bound to
      # a different port) would prove v2 was running: HAProxyOS's STATE
      # partition is one partition shared by both A/B slots, and
      # rootfs/init/main.go's seedPersistentHaproxyCfg deliberately
      # never overwrites an already-persisted config, so slot B keeps
      # serving whatever slot A already persisted there - correct,
      # intended behavior (an upgrade must never reset a node's
      # live-applied config). The test now proves genuinely new content
      # took effect the same way hack/qemu-uefi-ab-boot-test.sh proves a
      # slot switch did: by reading the kernel's own "Kernel command
      # line:" log line back and checking it references the new slot's
      # partitions and root hash, not by which HTTP port answers. A
      # bonus check calls Rollback afterward and confirms slot A's own
      # pre-existing staged UKI is still intact. See
      # hack/qemu-lifecycle-upgrade-test.sh.
      - name: LifecycleService.Upgrade installs a genuinely new rootfs for real (Phase 3 cont'd)
        run: make qemu-lifecycle-upgrade-test

      # Phase 3 cont'd: wait_for_health is real - a pending
      # "boot pending confirmation" marker (internal/bootcommit),
      # written to STATE right before the ESP switch, is what the
      # *next* boot's rootfs/init checks. A healthy new slot confirms
      # itself once haproxyosd has run stably (Supervisor.OnStable, the
      # same "survived StableAfter" signal the existing backoff-reset
      # already tracked, just fired proactively via its own timer
      # instead of retroactively off an eventual exit) and the marker
      # is cleared - no revert. An unhealthy one - haproxyosd
      # crash-looping without ever reaching that point - is bounded by
      # a new Supervisor.GiveUpAfter/OnGiveUp pair (the *one* documented
      # exception to this package's otherwise-unconditional "restart
      # forever" policy, only active when a marker is pending) that
      # reverts to the previously-active slot and reboots entirely on
      # its own - no RPC call drives the revert, since the original
      # Upgrade call's connection died with the first reboot already.
      # Both the confirm and revert paths share one ESP-swap primitive,
      # internal/espswitch.Activate, factored out of Rollback's own
      # inline logic once rootfs/init's local revert became a second
      # real consumer of it. hack/qemu-lifecycle-upgrade-health-test.sh
      # proves both directions against the same running node: a "good"
      # upgrade (the existing v1 rootfs, repackaged) must confirm and
      # never revert; a "broken" one (a fresh rootfs built with the
      # host's own dynamically-linked /bin/false standing in for
      # haproxyosd - this rootfs ships no dynamic linker/libc at all, so
      # every restart attempt fails at spawn() itself, a realistic
      # simulation of a badly built or wrong-architecture control-plane
      # binary) must reboot into it, then autonomously give up, revert,
      # and reboot back to whichever slot was actually active when the
      # broken Upgrade was called - not a hardcoded fallback.
      - name: LifecycleService.Upgrade's wait_for_health confirms or reverts automatically (Phase 3 cont'd)
        run: make qemu-lifecycle-upgrade-health-test

