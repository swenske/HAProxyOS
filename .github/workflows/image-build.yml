# Full HAProxyOS image build: kernel, pkgs/*, rootfs assembly, and the
# per-target disk images (image/disk, image/iso, image/kvm-proxmox,
# image/vmware). Runs on the self-hosted runner - this is the heavy,
# long-running, Docker-and-toolchain-dependent job, kept strictly separate
# from ci.yml (GitHub-hosted, safe for forks).
#
# workflow_dispatch only, on purpose - never triggered by push/pull_request.
# Phase 1 (kernel + shell-less init boots under QEMU) and Phase 2's static
# HAProxy build are real as of the steps below - verified both locally and
# by running this exact workflow. rootfs/assemble.sh and image/* (Phase 3)
# are still stubs - filled in phase by phase (see docs/architecture.md's
# roadmap) rather than added all at once.
name: Image Build

on:
  workflow_dispatch: {}

concurrency:
  group: image-build
  cancel-in-progress: false

jobs:
  build:
    # This project's own self-hosted runner (persistent Docker + build
    # cache), matching swenske/gotochanger's release.yml convention. Never
    # used for pull_request-triggered jobs - see ci.yml.
    runs-on: [self-hosted, docker, haproxyos]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Static musl+OpenSSL haproxy binary (see pkgs/haproxy/Dockerfile) to
      # build/haproxy.
      - name: Build HAProxy
        run: make haproxy-build

      # Builds bzImage from kernel/configs/haproxyos_defconfig (kernel/
      # Dockerfile's fetch -> config -> build -> export stages) and pulls
      # it out to build/bzImage.
      - name: Build kernel
        run: make kernel-build

      # Static Go PID 1 + initramfs packaging (see rootfs/init,
      # hack/build-initramfs.sh) - no pkgs/musl-toolchain or pkgs/busybox
      # needed for this: a CGO_ENABLED=0 Go binary has no libc to link
      # against (see docs/architecture.md's Phase 1 notes).
      - name: Build initramfs
        run: make initramfs

      # Boots the kernel + initramfs under QEMU and checks for rootfs/
      # init's success marker on the console (see hack/qemu-run.sh).
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86

      - name: Boot test under QEMU
        run: ./hack/qemu-run.sh build/bzImage build/initramfs.cpio.gz

      # Host-level integration test (not yet inside the QEMU-booted kernel
      # - that needs network drivers Phase 1's config deliberately doesn't
      # have; see docs/architecture.md): haproxyosd supervising the real
      # static haproxy binary, driven entirely through the gRPC API,
      # exactly as verified locally during Phase 2 development.
      - name: Build control-plane binaries
        run: make build

      - name: HAProxy integration test
        run: |
          set -euo pipefail
          # haproxyosd's own default paths (-haproxy-config/-pid/-stats-socket)
          # ARE the real target layout - use them as-is rather than
          # workspace-relative paths, since haproxy.cfg's "stats socket"
          # line (rootfs/base/etc/haproxy/haproxy.cfg) hardcodes
          # /run/haproxyos/haproxy-admin.sock and must match whatever
          # haproxyosd is told to look for.
          sudo mkdir -p /run/haproxyos /etc/haproxy
          sudo cp rootfs/base/etc/haproxy/haproxy.cfg /etc/haproxy/haproxy.cfg
          sudo chown -R "$(id -u):$(id -g)" /run/haproxyos /etc/haproxy

          ./bin/haproxyosd -addr :19505 -haproxy-binary "$PWD/build/haproxy" \
            & echo $! > /tmp/haproxyosd.pid
          trap 'kill "$(cat /tmp/haproxyosd.pid)" 2>/dev/null || true; pkill -f "$PWD/build/haproxy" 2>/dev/null || true' EXIT

          sleep 2
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/)"
          if [ "$code" != "200" ]; then
            echo "expected HTTP 200 from the bootstrap health frontend, got $code" >&2
            exit 1
          fi

          ./bin/haproxyosctl -endpoint 127.0.0.1:19505 haproxy show-info

      # TODO(Phase 3): rootfs/assemble.sh, image/disk (A/B + dm-verity +
      # UKI + Secure Boot), image/iso, image/kvm-proxmox, image/vmware,
      # upload artifacts to a GitHub Release. Also: get haproxy running
      # *inside* the QEMU-booted kernel (needs network drivers + IP
      # bring-up in rootfs/init, not just on the runner host).
      # TODO(Phase 5): pkgs/bird, pkgs/keepalived, pkgs/nftables - built
      # only into images that opt in via declarative configuration.
