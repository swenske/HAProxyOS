# Full HAProxyOS image build: kernel, pkgs/*, rootfs assembly, and the
# per-target disk images (image/disk, image/iso, image/kvm-proxmox,
# image/vmware). Runs on the self-hosted runner - this is the heavy,
# long-running, Docker-and-toolchain-dependent job, kept strictly separate
# from ci.yml (GitHub-hosted, safe for forks).
#
# workflow_dispatch only, on purpose - never triggered by push/pull_request.
# There's nothing real to build yet: kernel/Dockerfile has no "build"
# stage, pkgs/* (besides pkgs/haproxy's source fetch) are placeholders,
# and rootfs/assemble.sh deliberately exits 1. This workflow exists to
# pin down the shape of the pipeline now; the steps below are filled in
# phase by phase (see docs/architecture.md's roadmap) rather than added
# all at once later.
name: Image Build

on:
  workflow_dispatch: {}

concurrency:
  group: image-build
  cancel-in-progress: false

jobs:
  build:
    # This project's own self-hosted runner (persistent Docker + build
    # cache), matching swenske/gotochanger's release.yml convention. Never
    # used for pull_request-triggered jobs - see ci.yml.
    runs-on: [self-hosted, docker, haproxyos]
    steps:
      - uses: actions/checkout@v7

      - name: Fetch + verify pinned kernel source
        run: docker build --target fetch --build-arg KERNEL_VERSION=$(grep '^KERNEL_VERSION' versions.mk | cut -d= -f2 | xargs) kernel

      - name: Fetch pinned HAProxy source
        run: docker build --build-arg HAPROXY_VERSION=$(grep '^HAPROXY_VERSION' versions.mk | cut -d= -f2 | xargs) pkgs/haproxy

      # TODO(Phase 1): build the kernel from configs/haproxyos_defconfig,
      # build pkgs/musl-toolchain and pkgs/busybox, run rootfs/assemble.sh.
      # TODO(Phase 2): build pkgs/haproxy for real (static, musl).
      # TODO(Phase 3): image/disk (A/B + dm-verity + UKI + Secure Boot),
      # image/iso, image/kvm-proxmox, image/vmware, boot-test via
      # hack/qemu-run.sh, upload artifacts to a GitHub Release.
      # TODO(Phase 5): pkgs/bird, pkgs/keepalived, pkgs/nftables - built
      # only into images that opt in via declarative configuration.
      - name: Remaining build stages
        run: |
          echo "Not implemented yet - see the TODOs above and docs/architecture.md's roadmap." >&2
          exit 1
