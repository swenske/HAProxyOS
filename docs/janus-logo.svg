<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Janus, the two-faced Roman god">
  <title>Janus</title>
  <defs>
    <style>
      .janus-fill { fill: #3a3a3a; }
      @media (prefers-color-scheme: dark) {
        .janus-fill { fill: #e8e8e8; }
      }
    </style>
  </defs>
  <g class="janus-fill">
    <!-- shoulders, tapering up into the neck (overlaps the bottom of
         both head shapes below, no visible seam) -->
    <path d="M 60 185 Q 60 132 90 105 L 90 150 L 110 150 L 110 105 Q 140 132 140 185 Z" />

    <!-- left-facing profile: flat edge at center, round bulge to the
         left, with a small nose-bump partway down -->
    <path d="
      M 95 35
      A 38 38 0 1 0 95 111
      L 95 90
      L 82 82
      L 95 74
      Z" />
    <circle cx="80" cy="55" r="4.5" fill="#ffffff" />

    <!-- right-facing profile (mirror) -->
    <path d="
      M 105 35
      A 38 38 0 1 1 105 111
      L 105 90
      L 118 82
      L 105 74
      Z" />
    <circle cx="120" cy="55" r="4.5" fill="#ffffff" />
  </g>
</svg>
