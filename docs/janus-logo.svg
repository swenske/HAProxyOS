<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Janus, the two-faced Roman god">
  <title>Janus</title>
  <defs>
    <style>
      .janus-fill { fill: #3a3a3a; }
      @media (prefers-color-scheme: dark) {
        .janus-fill { fill: #e8e8e8; }
      }
    </style>
  </defs>
  <g class="janus-fill">
    <!-- shoulders/toga base -->
    <path d="M 55 195 Q 55 158 100 150 Q 145 158 145 195 Z" />

    <!-- left beard: generously overlaps the head shape below so the
         two fuse with no visible seam/gap -->
    <path d="M 100 68 Q 60 74 58 110 Q 56 148 100 152 Z" />
    <!-- right beard (mirror) -->
    <path d="M 100 68 Q 140 74 142 110 Q 144 148 100 152 Z" />

    <!-- left head: round crown, flat/seamed at center, small nose notch -->
    <path d="
      M 100 25
      A 30 30 0 1 0 100 85
      L 100 75
      L 90 70
      L 100 65
      Z" />
    <circle cx="76" cy="48" r="4" fill="#ffffff" />

    <!-- right head (mirror) -->
    <path d="
      M 100 25
      A 30 30 0 1 1 100 85
      L 100 75
      L 110 70
      L 100 65
      Z" />
    <circle cx="124" cy="48" r="4" fill="#ffffff" />

    <!-- center seam, crown to collar -->
    <rect x="98.5" y="23" width="3" height="132" />
  </g>
</svg>
