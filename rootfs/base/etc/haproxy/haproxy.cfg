# Default bootstrap config - what a freshly-installed node runs before
# any ApplyConfig call ever reaches it. Deliberately minimal: a stats
# socket for internal/haproxy.Manager, and a health-check frontend that
# needs no backend, so a booted-but-unconfigured node still answers
# something instead of listening on nothing. Real traffic config always
# arrives via HAProxyService.ApplyConfig - this file is never meant to be
# hand-edited on a running node (see docs/architecture.md: no shell).
global
    stats socket /run/haproxyos/haproxy-admin.sock mode 660 level admin

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend haproxyos-health
    bind *:8080
    http-request return status 200 content-type text/plain string "HAProxyOS: haproxy is up\n"
